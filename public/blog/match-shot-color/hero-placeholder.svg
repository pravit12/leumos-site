<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Three film frames in a row, being color matched">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d14"/>
      <stop offset="0.6" stop-color="#161a25"/>
      <stop offset="1" stop-color="#7a340f"/>
    </linearGradient>
    <linearGradient id="frame1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#737a8c"/>
      <stop offset="1" stop-color="#222735"/>
    </linearGradient>
    <linearGradient id="frame2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dd7404"/>
      <stop offset="1" stop-color="#7a340f"/>
    </linearGradient>
    <linearGradient id="frame3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd14a"/>
      <stop offset="1" stop-color="#fa9c0a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g transform="translate(120 220)">
    <rect width="400" height="460" rx="16" fill="url(#frame1)" stroke="#fffaeb" stroke-opacity="0.2" stroke-width="2"/>
  </g>
  <g transform="translate(600 220)">
    <rect width="400" height="460" rx="16" fill="url(#frame2)" stroke="#fffaeb" stroke-opacity="0.2" stroke-width="2"/>
  </g>
  <g transform="translate(1080 220)">
    <rect width="400" height="460" rx="16" fill="url(#frame3)" stroke="#fffaeb" stroke-opacity="0.2" stroke-width="2"/>
  </g>
  <text x="120" y="180" font-family="system-ui, sans-serif" font-size="32" letter-spacing="6" fill="#ffd14a">FIELD GUIDE · COLOR</text>
  <text x="120" y="780" font-family="system-ui, sans-serif" font-size="42" font-weight="600" fill="#fffaeb">Three frames. Same scene. Same look.</text>
</svg>
